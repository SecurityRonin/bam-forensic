
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/rust-crate-audits/main/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[policy.bam-core]
audit-as-crates-io = false

[policy.bam-forensic]
audit-as-crates-io = false

[[exemptions.binrw]]
version = "0.4.0"
criteria = "safe-to-deploy"

[[exemptions.binrw_derive]]
version = "0.4.0"
criteria = "safe-to-deploy"

[[exemptions.bitflags]]
version = "2.13.1"
criteria = "safe-to-deploy"

[[exemptions.cfg-if]]
version = "1.0.4"
criteria = "safe-to-deploy"

[[exemptions.defmt]]
version = "1.1.1"
criteria = "safe-to-deploy"

[[exemptions.defmt-macros]]
version = "1.1.1"
criteria = "safe-to-deploy"

[[exemptions.defmt-parser]]
version = "1.0.0"
criteria = "safe-to-deploy"

[[exemptions.log]]
version = "0.4.33"
criteria = "safe-to-deploy"

[[exemptions.memmap2]]
version = "0.9.11"
criteria = "safe-to-deploy"

[[exemptions.miette]]
version = "7.6.0"
criteria = "safe-to-deploy"

[[exemptions.miette-derive]]
version = "7.6.0"
criteria = "safe-to-deploy"

[[exemptions.portable-atomic-util]]
version = "0.2.7"
criteria = "safe-to-deploy"

[[exemptions.windows-link]]
version = "0.2.1"
criteria = "safe-to-deploy"
